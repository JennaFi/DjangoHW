{% extends 'base.html' %}

{% block content %}

<div class="container">


    <h4>Авторизация</h4>


    <div class="input-group mb-3">
        <form class="horizontal" method="post" enctype="multipart/form-data">

            <div class="card-header">

                {% csrf_token %}
                {{ form.as_p }}

            </div>

            <button type="submit" class="btn btn-primary">
                Зарегистрироваться
            </button>

        </form>
    </div>
</div>


{% endblock %}

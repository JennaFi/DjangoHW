{% extends 'catalog/base.html' %}

{% load catalog_tags %}

<div class="col">

    <div class="container-fluid">
        <div class="row g-0">
            <img src="{{ article.preview | media_filter }}"
                 style="max-width: 300px; min-height: 20vh; padding 5px; margin-right: 40px;">

            <h3>{{ article.title }}</h3>
            <p class="card-text">{{ article.content }}</p>
            <p class="card-text">
                <small class="text-body-secondary">
                    Read: {{ article.view_count }} times

                </small>
            </p>
            <p class="card-text">
                <small class="text-body-secondary">
                    Published: {{ article.created_at }}
                </small>
            </p>


            <div class="d-flex justify-content-between align-items-center">
                <div class="btn-group">
                    <button type="button" class="btn btn-sm btn-outline-secondary">Add to favorites</button>

                </div>
                <a class="btn btn-sm btn-outline-secondary"
                   href="{% url 'blog:article_list' %}"
                   role="button">Go back
                </a>
                <a class="btn btn-sm btn-danger btn-out"
                   href="{% url 'blog:article_delete' article.pk %}"
                   role="button">Delete
                </a>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block content %}

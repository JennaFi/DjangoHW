{% extends 'base.html' %}
{% load catalog_tags %}

{% block content %}

<div class="container">
     <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
         {% for product in products %}
    <div class="col">

          <div class="card shadow-sm">
            <img src="{{ product.image | media_filter }}" class="img-fluid" style="height: 20rem; object-fit: cover;">
            <div class="card-body">
              <p class="card-text">{{ product.name }}</p>
                <p class="card-text">{{ product.category }}</p>
                <p class="card-text">{{ product.description|truncatechars:100 }}</p>
                <p class="card-text">${{ product.price }}</p>


              <div class="d-flex justify-content-between align-items-center">
                <div class="btn-group">
                  <a class="btn btn-sm btn-outline-secondary"
                     href="{% url 'catalog:product_detail' product.pk %}"
                     role="button">Посмотреть
                  </a>
                  <button type="button" class="btn btn-sm btn-outline-secondary">Купить</button>
                </div>

              </div>
            </div>

          </div>

    </div>
 {% endfor %}
    </div>
</div>

{% endblock %}

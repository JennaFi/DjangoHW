{% extends 'base.html' %}

{% block content %}

<div class="container">

    <h4>Удаление товара</h4>


    <p class="card-text">Вы уверены, что хотите удалить {{ product.name }}?</p>

    <div class="input-group mb-3">
        <form class="horizontal" method="post" enctype="multipart/form-data">

            <div class="card-header">

                {% csrf_token %}

            </div>
            <a class="btn btn-primary" href="{% url 'catalog:product_detail' product.pk %}" role="button">
                Отмена
            </a>

            <button type="submit" class="btn btn-danger">
                Удалить

            </button>



        </form>
    </div>
</div>



{% endblock %}

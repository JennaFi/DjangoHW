{% extends 'base.html' %}

{% load catalog_tags %}

{% block content %}


<div class="container">
    <div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
        <a type="button" class="btn btn-sm btn-outline-primary" href="{% url 'catalog:product_create' %}">
            Добавить новый товар
        </a>
    </div>
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">

        {% for product in products %}
        <div class="col">

            <div class="card shadow-sm">
                <img src="{{ product.image | media_filter }}" class="img-fluid"
                     style="height: 20rem; object-fit: cover;">
                <div class="card-body">
                    <p class="card-text">{{ product.name }}</p>
                    <p class="card-text">{{ product.category }}</p>
                    <p class="card-text">{{ product.description|truncatechars:100 }}</p>
                    <p class="card-text">{{ product.price }}</p>


                    <div class="d-flex justify-content-between align-items-center">
                        <div class="btn-group">
                            <a class="btn btn-sm btn-primary"
                               href="{% url 'catalog:product_detail' product.pk %}"
                               role="button">Посмотреть
                            </a>
                            <a class="btn btn-sm btn-outline-secondary"
                               href="{% url 'catalog:product_update' product.pk %}"
                               role="button">Редактировать
                            </a>
                            <button type="button" class="btn btn-sm btn-outline-secondary">Купить</button>
                            <a class="btn btn-sm btn-danger btn-out"
                               href="{% url 'catalog:product_delete' product.pk %}"
                               role="button">Удалить
                            </a>
                        </div>

                    </div>
                </div>

            </div>

        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
